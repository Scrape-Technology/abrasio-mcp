[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abrasio-mcp"
version = "0.1.1"
description = "MCP server that exposes Abrasio as an agentic browser for AI models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Scrape Technology", email = "joao.sobhie@scrapetechnology.com" }
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "ai-agents",
    "browser-automation",
    "stealth-browser",
    "scraping-browser",
    "managed-browser",
    "playwright",
    "abrasio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.8,<2",
    "abrasio>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
abrasio-mcp = "abrasio_mcp.server:main"

[project.urls]
Homepage = "https://scrapetechnology.com/abrasio"
Documentation = "https://scrapetechnology.com/abrasio/docs"
Repository = "https://github.com/Scrape-Technology/abrasio-mcp"
Issues = "https://github.com/Scrape-Technology/abrasio-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["abrasio_mcp"]

[tool.hatch.build.targets.sdist]
include = ["abrasio_mcp", "README.md", "LICENSE", "pyproject.toml"]
